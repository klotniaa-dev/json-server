name: secret-scan

# Cadence: runs every hour. Review window: each run scans commits from the
# last 7 days. A full-history scan runs weekly (Monday 03:17 UTC) or on demand.
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the full git history instead of the last 7 days'
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks
      - name: Scan for exposed secrets
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FULL_HISTORY_INPUT: ${{ inputs.full_history }}
        run: |
          if [ "$EVENT_SCHEDULE" = '17 3 * * 1' ] || [ "$FULL_HISTORY_INPUT" = 'true' ]; then
            mode='full history'
            log_opts='--all'
          else
            mode='last 7 days'
            log_opts='--all --since=7.days.ago'
          fi
          status=0
          gitleaks detect --redact --no-banner --exit-code 1 \
            --log-opts="$log_opts" \
            --report-format json --report-path gitleaks-report.json || status=$?
          count=$(python3 -c "import json;print(len(json.load(open('gitleaks-report.json'))))" 2>/dev/null || echo 0)
          {
            echo "## Secret scan"
            echo "- Scope: ${mode}"
            echo "- Findings: ${count}"
            if [ "$status" -ne 0 ]; then
              echo "- Result: FAILED (values are redacted; see the gitleaks-report artifact)"
            else
              echo "- Result: clean"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload redacted report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14
