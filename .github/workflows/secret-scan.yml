name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Hourly scan of the working tree and recent history.
    - cron: '0 * * * *'
    # Weekly full-history review (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan working tree
        run: ./gitleaks dir . --redact --no-banner --report-format sarif --report-path gitleaks-tree.sarif
      - name: Scan recent history (hourly, push, pull request)
        if: github.event_name != 'workflow_dispatch' && github.event.schedule != '0 6 * * 1'
        run: ./gitleaks git . --redact --no-banner --log-opts="--since=2.hours.ago" --report-format sarif --report-path gitleaks-recent.sarif
      - name: Scan full history (weekly review, manual run)
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: ./gitleaks git . --redact --no-banner --report-format sarif --report-path gitleaks-full.sarif
      - name: Upload redacted reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
          if-no-files-found: ignore
