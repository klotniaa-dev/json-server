# Hourly secret scanning.
#
# Cadence: runs every hour (cron "0 * * * *"). Each run reviews a rolling
# 7-day window of commits (--since=7.days), i.e. a continuously refreshed
# weekly security review for exposed secrets/credentials.
# The dedicated Monday 00:00 UTC cron ("0 0 * * 1") and manual runs with
# full_history=true scan the full git history instead. Pull requests scan only
# the commits they add, and pushes to main scan the pushed range (before..after)
# so old-dated commits pushed directly are not missed by the date window.
# Findings are redacted in all output. The job fails when a secret is found.
# Note: the 7-day window is often empty; the scan is then skipped cleanly.
# Operations: a finding fails every run until it leaves the window, so rotate
# the secret and, if it is a false positive, add a commented entry to the
# [allowlist] in .gitleaks.toml. GitHub disables scheduled workflows after 60
# days without repository activity and only notifies the last cron editor, so
# watch the Actions tab (or subscribe to workflow failures) for this workflow.
name: Secret scan

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan the full git history instead of the last 7 days
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum --check -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "$tarball" checksums.txt

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FULL_HISTORY_INPUT: ${{ inputs.full_history }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          args=(--config .gitleaks.toml --redact --report-format sarif --report-path gitleaks.sarif)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Scanning pull request commits"
            args+=("--log-opts=${PR_BASE_SHA}..${PR_HEAD_SHA}")
          elif [ "$EVENT_NAME" = "push" ] && [ "${PUSH_BEFORE_SHA#0000000}" != "$PUSH_BEFORE_SHA" ]; then
            echo "New branch push; scanning full history"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "Scanning pushed commits"
            args+=("--log-opts=${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}")
          elif [ "$FULL_HISTORY_INPUT" = "true" ] || [ "$SCHEDULE" = "0 0 * * 1" ]; then
            echo "Scanning full history"
          else
            if [ -z "$(git log --since=7.days -n 1 --format=%H)" ]; then
              echo "No commits in the last 7 days; nothing to scan."
              exit 0
            fi
            echo "Scanning commits from the last 7 days"
            args+=(--log-opts=--since=7.days)
          fi
          gitleaks git "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
