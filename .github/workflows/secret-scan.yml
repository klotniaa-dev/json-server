name: Secret scan
on:
  schedule:
    # Hourly: scan commits from the last 24 hours.
    - cron: "0 * * * *"
    # Weekly (Monday 06:00 UTC): full git history review.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      full-history:
        description: Scan the full git history
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FULL_HISTORY: ${{ inputs.full-history }}
        run: |
          args=(detect --source . --redact --no-banner --verbose --report-format sarif --report-path gitleaks.sarif)
          if [ "$EVENT_SCHEDULE" = "0 6 * * 1" ] || [ "$FULL_HISTORY" = "true" ]; then
            echo "Full history scan"
          else
            echo "Scanning commits from the last 24 hours"
            args+=(--log-opts="--since=24.hours")
          fi
          ./gitleaks "${args[@]}"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30
