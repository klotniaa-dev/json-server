name: Secret scan
# Hourly scan for exposed secrets/credentials, plus a weekly full-history review.
on:
  schedule:
    - cron: "17 * * * *" # hourly scan
    - cron: "23 6 * * 1" # weekly full-history review, Mondays 06:23 UTC
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  scan:
    name: Hourly secret scan
    if: github.event.schedule != '23 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
          rm gitleaks.tar.gz
      - name: Scan repository
        run: '"${RUNNER_TEMP}/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --verbose'

  weekly-review:
    name: Weekly full-history review
    if: github.event.schedule == '23 6 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
          rm gitleaks.tar.gz
      - name: Full-history scan
        id: scan
        run: |
          status=0
          "${RUNNER_TEMP}/gitleaks" detect --source . --config .gitleaks.toml --log-opts=--all \
            --redact --no-banner --report-format sarif --report-path "${RUNNER_TEMP}/gitleaks-weekly.sarif" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "gitleaks failed with exit code $status" >&2
            exit "$status"
          fi
          echo "findings=$(grep -c '"ruleId"' "${RUNNER_TEMP}/gitleaks-weekly.sarif" || true)" >> "$GITHUB_OUTPUT"
          cp "${RUNNER_TEMP}/gitleaks-weekly.sarif" gitleaks-weekly.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-weekly-report
          path: gitleaks-weekly.sarif
          retention-days: 90
      - name: Open or update the weekly report issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly secret scan report"
          if [ "${FINDINGS:-0}" = "0" ]; then
            summary="Clean: no exposed secrets found in the full git history."
          else
            summary="ATTENTION: ${FINDINGS} potential secret(s) found. Rotate the credential first, then purge it from history. Download the redacted SARIF report from the run artifacts."
          fi
          body="$(printf '%s\n\nRun: %s\nDate: %s' "$summary" "$RUN_URL" "$(date -u +%Y-%m-%dT%H:%MZ)")"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[]|select(.title==\"$title\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
