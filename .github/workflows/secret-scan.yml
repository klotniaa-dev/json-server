name: Secret scan
on:
  schedule:
    # Hourly: scan the most recent commits
    - cron: "0 * * * *"
    # Weekly (Monday 03:00 UTC): scan the full git history
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Scan the full git history"
        type: boolean
        default: false
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      SCHEDULE: ${{ github.event.schedule }}
      FULL_HISTORY_INPUT: ${{ inputs.full_history }}
    steps:
      - name: Select scan mode
        id: mode
        run: |
          if [ "$SCHEDULE" = "0 3 * * 1" ] || [ "$FULL_HISTORY_INPUT" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "depth=0" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "depth=50" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ steps.mode.outputs.depth }}
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan full history
        if: steps.mode.outputs.full == 'true'
        run: >
          "$RUNNER_TEMP/gitleaks/gitleaks" git
          --redact --no-banner
          --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"
          .
      - name: Scan recent commits
        if: steps.mode.outputs.full != 'true'
        run: >
          "$RUNNER_TEMP/gitleaks/gitleaks" git
          --redact --no-banner
          --log-opts="-n 50"
          --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"
          .
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
