# Secret scan.
# Hourly: scans the working tree and commits from the last 2 hours (overlap avoids gaps).
# Weekly (Monday 03:00 UTC) and manual runs: full git history review.
name: Secret Scan
on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-scan
  cancel-in-progress: false
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
          rm gitleaks.tar.gz
      - name: Scan working tree
        run: |
          "${RUNNER_TEMP}/gitleaks" detect --no-git --source . --redact --no-banner \
            --report-format sarif --report-path "${RUNNER_TEMP}/tree.sarif"
      - name: Scan recent commits (hourly)
        if: github.event.schedule != '0 3 * * 1' && github.event_name != 'workflow_dispatch'
        run: |
          "${RUNNER_TEMP}/gitleaks" detect --source . --redact --no-banner \
            --log-opts="--since=2.hours.ago --all" \
            --report-format sarif --report-path "${RUNNER_TEMP}/recent.sarif"
      - name: Scan full history (weekly or manual)
        if: github.event.schedule == '0 3 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          "${RUNNER_TEMP}/gitleaks" detect --source . --redact --no-banner \
            --report-format sarif --report-path "${RUNNER_TEMP}/history.sarif"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/*.sarif
          if-no-files-found: ignore
