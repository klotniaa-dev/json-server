name: Secret scan

# Hourly scan of the full git history for exposed secrets and credentials.
# A separate weekly run (Monday 06:00 UTC) keeps a consolidated report for the
# weekly security review.
on:
  schedule:
    - cron: '0 * * * *'   # hourly scan
    - cron: '0 6 * * 1'   # weekly review report
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan full history
        id: scan
        run: |
          set +e
          "${RUNNER_TEMP}/gitleaks/gitleaks" detect --source . --redact --no-banner \
            --report-format sarif --report-path "${RUNNER_TEMP}/gitleaks.sarif"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: ${{ github.event.schedule == '0 6 * * 1' && 90 || 7 }}
      - name: Weekly summary
        if: always() && github.event.schedule == '0 6 * * 1'
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          {
            echo "## Weekly secret scan review"
            echo
            if [ "${EXIT_CODE}" = "0" ]; then
              echo "No exposed secrets found in the full git history."
            else
              echo "Gitleaks reported findings (exit code ${EXIT_CODE}). Download the gitleaks-report artifact (values are redacted)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on findings
        if: steps.scan.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          echo "Secret scan failed with exit code ${EXIT_CODE}"
          exit 1
