name: Secret scan
on:
  schedule:
    # Runs at the top of every hour.
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
