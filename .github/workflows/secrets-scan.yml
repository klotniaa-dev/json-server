name: Secrets scan
# "Weekly security review, run hourly" is implemented as:
#  - hourly: fast scan of the working tree and the last 2 hours of history
#  - weekly: deep scan of the full git history, with a redacted report artifact
# See docs/SECURITY-SECRETS-REVIEW.md.
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  hourly-scan:
    if: github.event_name != 'schedule' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan working tree
        run: gitleaks detect --no-git --redact --verbose --config .gitleaks.toml
      - name: Scan recent history
        run: gitleaks detect --redact --verbose --config .gitleaks.toml --log-opts="--since=2.hours.ago"
  weekly-deep-scan:
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan full history
        run: gitleaks detect --redact --verbose --config .gitleaks.toml --report-format json --report-path "${RUNNER_TEMP}/gitleaks-report.json"
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 90
