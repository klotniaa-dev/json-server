name: Secrets scan

# Hourly: scan the checked-out tree for exposed secrets/credentials.
# Weekly (Monday 06:00 UTC): deep review of the full git history with a summary.
on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the full git history (weekly review mode)'
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.event.schedule || github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FULL_HISTORY_INPUT: ${{ github.event.inputs.full_history }}
        run: |
          mkdir -p reports
          if [ "$SCHEDULE" = "0 6 * * 1" ] || [ "$FULL_HISTORY_INPUT" = "true" ]; then
            mode="weekly full-history review"
            args=(detect --source .)
          else
            mode="hourly working-tree scan"
            args=(detect --source . --no-git)
          fi
          status=0
          ./gitleaks "${args[@]}" --redact --no-banner \
            --report-format json --report-path reports/gitleaks.json || status=$?
          count=$(python3 -c "import json;print(len(json.load(open('reports/gitleaks.json'))))" 2>/dev/null || echo 0)
          {
            echo "## Secrets scan: ${mode}"
            echo
            echo "- Findings: ${count}"
            echo "- gitleaks exit code: ${status}"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Rule | File | Line | Commit |"
              echo "| --- | --- | --- | --- |"
              python3 - <<'PY'
          import json
          for f in json.load(open("reports/gitleaks.json")):
              print("| {} | {} | {} | {} |".format(
                  f.get("RuleID"), f.get("File"), f.get("StartLine"), (f.get("Commit") or "")[:8]))
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: reports/gitleaks.json
          if-no-files-found: ignore
          retention-days: 30
